name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Swift 6 tools version needs a recent Xcode; select the newest the
      # runner has rather than trusting the default
      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Build
        run: swift build -v

      - name: Test RazerStreamKit
        run: swift test -v
        working-directory: Packages/RazerStreamKit

      - name: Test OBSKit
        run: swift test -v
        working-directory: Packages/OBSKit

      # A ready-to-run app for every PR, so a change can be tried on the deck
      # without a local toolchain. Ad hoc signed; re-sign locally if needed.
      - name: Package app
        run: |
          scripts/make_app.sh release
          ditto -c -k --keepParent dist/RazerStream.app dist/RazerStream.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RazerStream-app
          path: dist/RazerStream.zip
          retention-days: 14
